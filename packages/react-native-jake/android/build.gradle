buildscript {
  ext.kotlin_version = rootProject.ext.has("kotlinVersion")
    ? rootProject.ext.get("kotlinVersion")
    : "2.1.0"
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.7.3"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "ai.tryjake.reactnative"
  compileSdkVersion rootProject.ext.has("compileSdkVersion")
    ? rootProject.ext.get("compileSdkVersion")
    : 35

  defaultConfig {
    minSdkVersion 23
    targetSdkVersion rootProject.ext.has("targetSdkVersion")
      ? rootProject.ext.get("targetSdkVersion")
      : 35
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  if (findProject(":jake-sdk") != null) {
    implementation project(":jake-sdk")
  } else {
    implementation "ai.tryjake:jake-sdk:0.1.0"
  }
}
